name: Quality-of-life suggestion
description: An optional feature that the original game does not have.
body:
  - type: markdown
    attributes:
      value: Suggestions are welcome, but they are not guaranteed to be accepted. The faithful game stays the default.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should it do, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: default
    attributes:
      label: Default behaviour
      description: How does the game behave when the option is off?
