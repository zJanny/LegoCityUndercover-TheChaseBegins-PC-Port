name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: offscreen
  SDL_AUDIODRIVER: dummy

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates git cmake g++ make pkg-config python3 \
            libsdl2-dev libepoxy-dev \
            libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: CTest without slow and game-data tests
        run: ctest --test-dir build -j"$(nproc)" -LE 'slow|needs-game-data' --output-on-failure
