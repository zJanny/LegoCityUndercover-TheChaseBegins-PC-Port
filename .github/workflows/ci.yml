name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDL_VIDEODRIVER: offscreen
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Install build dependencies
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl git g++ make pkg-config python3 \
            libsdl2-dev libepoxy-dev \
            libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev
      - name: Install CMake 4.4.5
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5-linux-x86_64.tar.gz
          echo "ed85135c5a5135b45e50423cb406dea04ca3338da0b8ef3c9ede963559680be0  /tmp/cmake.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/cmake"
          tar -xzf /tmp/cmake.tar.gz -C "$HOME/cmake" --strip-components=1
          echo "$HOME/cmake/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: CTest without slow and game-data tests
        run: ctest --test-dir build -j"$(nproc)" -LE 'slow|needs-game-data' --output-on-failure

  windows-build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SDL_AUDIODRIVER: dummy
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Use the Git for Windows default line endings
        shell: bash
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl2-compat
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-ffmpeg
      - name: Line endings of the clone
        shell: bash
        run: |
          test "$(git config --get core.autocrlf)" = "true"
          python tests/test_line_endings.py -v
          git ls-files --eol | awk -F'\t' '{ split($1, f, " "); if (f[2] ~ /^w\/(crlf|mixed)$/ && f[3] != "attr/-text" && f[3] != "attr/binary") { print; bad = 1 } } END { exit bad }'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCHASE_BUILD_TESTS=ON -DPython3_EXECUTABLE="$(cygpath -m "$pythonLocation")/python.exe"
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Python tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: CTest without slow and game-data tests
        run: ctest --test-dir build -j"$(nproc)" -LE 'slow|needs-game-data' --output-on-failure
      - name: Package the Windows zip
        id: package
        run: |
          python="$(cygpath -m "$pythonLocation")/python.exe"
          case "$GITHUB_REF" in
            refs/tags/v*) version="$GITHUB_REF_NAME" ;;
            *) version="$(git rev-parse --short=8 HEAD)" ;;
          esac
          "$python" tools/package_windows.py --version "$version" --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --output-dir release --runtime-dir "$(cygpath -m /ucrt64/bin)"
          echo "zip=release/chase-windows-$version.zip" >> "$GITHUB_OUTPUT"
      - name: Start the zip with only System32 on the PATH
        shell: pwsh
        env:
          ZIP: ${{ steps.package.outputs.zip }}
          SDL_VIDEODRIVER: dummy
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive -Path $env:ZIP -DestinationPath $folder
          $root = (Get-ChildItem $folder -Directory | Select-Object -First 1).FullName
          Set-Location $root
          $python = Join-Path $env:pythonLocation 'python.exe'
          $env:PATH = 'C:\Windows\System32'
          $output = & .\build\chase-input-lab.exe --smoke-test | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'smoke test passed') { throw 'chase-input-lab did not start from the zip' }
          & $python -I -c "import sys; sys.path.insert(0, 'tools'); import chase_native; chase_native.library(); print('libchase_assets_c.dll loaded')"
          if ($LASTEXITCODE -ne 0) { throw 'libchase_assets_c.dll did not load from the zip' }
      - name: Upload the zip as a workflow artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: chase-windows
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "Windows development build. Not a playable game yet. It contains no game data: extract it from your own game image with the bundled tools (Python 3.11 or newer needed). See README.txt inside the zip."
          fi
