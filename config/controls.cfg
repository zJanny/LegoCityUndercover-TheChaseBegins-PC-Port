# Action source code mode
# SDL key names use underscores for spaces (e.g. Left_Shift).
# Change hold to toggle to latch an action until its next press.
# Multiple bindings for one action combine; releasing one keeps others active.
# Focus loss clears every held and toggled action.
Up key W hold
Up key Up hold
Down key S hold
Down key Down hold
Left key A hold
Left key Left hold
Right key D hold
Right key Right hold
A key Space hold
A mouse Left hold
B key Q hold
B mouse Right hold
X key E hold
Y key R hold
L key Z hold
R key C hold
Start key Return hold
Select key Tab hold
# Walk is not a 3DS button: the development runtime tilts the stick halfway while it is held.
Walk key Left_Alt hold
# DebugOverlay is a developer tool of chase-game, not a 3DS button: it shows or hides the debug overlay (docs/debug-overlay.md).
DebugOverlay key F3 toggle
# Fullscreen is not a 3DS button: it switches chase-game between windowed and borderless full screen and stores the choice as window_mode in config/qol.cfg. Keep it on hold.
Fullscreen key F11 hold
# Left mouse also sends touch coordinates over the lower-screen viewport.
# Escape always quits the lab.
